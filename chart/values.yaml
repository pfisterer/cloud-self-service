# Defaults for the umbrella chart.
#
# Almost nothing lives here on purpose: every value that differs between
# environments is passed in by the deployment (Argo CD's spec.source.helm.values,
# rendered from the inventory), and the subcharts carry their own defaults and
# their own values.schema.json. What remains here is the one thing only the
# umbrella can decide — what the resources are called.
#
# Each subchart's values go under its chart name, e.g.
#
#   dynamic-zones:
#     dynamicZonesAPI: { ... }
#     powerDNS: { ... }

# Without these, every resource name would carry the release name as a prefix.
# That is not merely cosmetic: some of these Service names are referenced from
# outside this chart — the UI's Caddy forwards to them by name — so changing
# them is a coordinated change, not a rename. Drop or edit these only in a
# window where every reference moves with them.
dynamic-zones:
  fullnameOverride: dynamic-zones

openstack-management-api:
  fullnameOverride: openstack-management-api

role-provider-service:
  fullnameOverride: role-provider-service

self-service-ui:
  fullnameOverride: self-service-ui
