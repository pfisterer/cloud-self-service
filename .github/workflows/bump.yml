name: Bump subcharts

# Deliberately a pull job in this repository rather than a push from each
# service's CI: that would need a cross-repository token in four places, and
# this needs none — the workflow only writes to its own repository.
#
# It replaces what argocd-image-updater used to do, one level up. The updater
# rewrote the image tag in a live Application, which is exactly the outside
# influence the umbrella exists to remove. Here the newest subchart version is
# written into Chart.yaml, and everything downstream follows from it: subchart
# version pins appVersion pins image tag.
# Every 5 minutes (GitHub's shortest schedule; runs can start a few minutes late): the services publish every green commit on main, and staging should not wait a quarter of an hour for it. A service's CI can also start this right away with workflow_dispatch if it has a token for that (UMBRELLA_DISPATCH_TOKEN, see README).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Schedule and dispatch can overlap; two bumps at once would both try to publish the next version.
concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # ">=0.0.0-0", not ">=0.0.0": plain ">=0.0.0" excludes prereleases by
      # semver rule, and the services publish -test.N. The trailing -0 is what
      # makes them eligible at all.
      # The rule itself is in hack/bump.py, shared with `make bump`.
      # Resolve, commit and push in one loop: a push can be rejected when main moved meanwhile (a release commit, or a bump started just before this one with an older checkout). Then the bump starts over on the fresh main — resolving again, since the next version depends on what is there — instead of ending red; at most three tries.
      - name: Resolve, update the lock and push
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            out=$(python3 hack/bump.py)
            echo "$out"
            changed=$(printf '%s\n' "$out" | sed -n 's/^changed=//p')
            version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')
            if [ -z "$changed" ]; then
              echo "changed=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            helm dependency update chart/
            helm lint chart/
            helm template cloud-self-service chart/ > /dev/null
            git add chart/Chart.yaml chart/Chart.lock
            git commit --quiet -m "release $version" -m "$changed"
            if git push --quiet origin HEAD:main; then
              { echo "changed=$changed"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::push rejected (try $try), main moved; starting over on the fresh main"
            sleep $((try * 5))
          done
          echo "::error::push rejected three times"
          exit 1

      # Published from here rather than left to chart.yml: a push made with
      # GITHUB_TOKEN does not trigger further workflows, so nothing else
      # would pick this up.
      - name: Publish the chart
        if: steps.bump.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          helm package chart/ --destination "$RUNNER_TEMP"
          # GHCR sometimes answers "failed to perform Tag … not found" right after the upload; a second push succeeds.
          for i in 1 2 3; do
            helm push "$RUNNER_TEMP"/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts" && exit 0
            echo "::warning::helm push failed (try $i), retrying"; sleep $((i * 10))
          done
          exit 1
